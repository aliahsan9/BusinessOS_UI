@if (isOpen()) {
  <div
    class="ai-widget__backdrop"
    [class.ai-widget__backdrop--mobile]="isMobile()"
    (click)="close()"
    aria-hidden="true"
  ></div>
}

<div
  class="ai-widget"
  [class.ai-widget--open]="isOpen()"
  [class.ai-widget--mobile]="isMobile()"
>
  @if (isOpen()) {
    <app-ai-chat-window
      class="ai-widget__window"
      [class.ai-widget__window--mobile]="isMobile()"
      (close)="close()"
      (navigate)="navigate($event)"
    />
  }

  <button
    type="button"
    class="ai-widget__fab"
    [class.ai-widget__fab--active]="isOpen()"
    [class.ai-widget__fab--icon-only]="isMobile()"
    aria-label="Talk to Sophia"
    [attr.aria-expanded]="isOpen()"
    (click)="toggle()"
  >
    @if (isOpen() && isMobile()) {
      <i class="bi bi-x-lg ai-widget__fab-icon"></i>
    } @else {
      <span class="ai-widget__fab-avatar" aria-hidden="true">
        <svg class="ai-widget__fab-avatar-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 3.2 13.35 7.1a1.2 1.2 0 0 0 .75.75L18 9.2l-3.9 1.35a1.2 1.2 0 0 0-.75.75L12 15l-1.35-3.7a1.2 1.2 0 0 0-.75-.75L6 9.2l3.9-1.35a1.2 1.2 0 0 0 .75-.75L12 3.2Z"
            fill="currentColor"
            opacity="0.95"
          />
          <path
            d="M18.2 14.1 18.85 16a.7.7 0 0 0 .45.45l1.9.65-1.9.65a.7.7 0 0 0-.45.45l-.65 1.9-.65-1.9a.7.7 0 0 0-.45-.45l-1.9-.65 1.9-.65a.7.7 0 0 0 .45-.45l.65-1.9Z"
            fill="currentColor"
            opacity="0.75"
          />
          <circle cx="6.2" cy="16.6" r="1.15" fill="currentColor" opacity="0.7" />
          <circle cx="8.6" cy="19.1" r="0.7" fill="currentColor" opacity="0.55" />
        </svg>
      </span>
      @if (!isMobile()) {
        <span class="ai-widget__fab-copy">
          <span class="ai-widget__fab-label">Sophia</span>
          <span class="ai-widget__fab-sub">Ask anything</span>
        </span>
        <i
          class="bi bi-chevron-down ai-widget__fab-arrow"
          [class.ai-widget__fab-arrow--open]="isOpen()"
        ></i>
      }
    }
  </button>
</div>
