<header class="app-navbar">
  <div class="app-navbar__start">
    <button
      type="button"
      class="btn app-navbar__menu-btn"
      aria-label="Toggle navigation"
      (click)="menuToggle.emit()"
    >
      <i class="bi bi-list"></i>
    </button>

    <label class="app-navbar__search" aria-label="Search">
      <i class="bi bi-search" aria-hidden="true"></i>
      <input
        type="search"
        [placeholder]="searchPlaceholder()"
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        (keydown.enter)="submitSearch()"
      />
      <kbd class="app-navbar__search-kbd">Ctrl K</kbd>
    </label>
  </div>

  <div class="app-navbar__actions">
    <button
      type="button"
      class="btn app-navbar__icon-btn"
      [attr.aria-label]="isDarkMode() ? 'Light mode' : 'Dark mode'"
      (click)="toggleDarkMode()"
    >
      <i
        class="bi"
        [class.bi-sun]="isDarkMode()"
        [class.bi-moon-stars]="!isDarkMode()"
      ></i>
    </button>

    <button
      type="button"
      class="btn app-navbar__icon-btn"
      [class.active]="aiAssistantOpen()"
      aria-label="BusinessOS AI"
      (click)="toggleAiAssistant()"
    >
      <i class="bi bi-stars"></i>
    </button>

    @if (canViewNotifications()) {
      <app-notification-bell />
    }

    <div class="app-navbar__dropdown">
      <button
        type="button"
        class="app-navbar__profile"
        [attr.aria-expanded]="showProfile()"
        (click)="toggleProfile()"
      >
        @if (showCompanyLogo()) {
          <img
            class="app-navbar__avatar"
            [src]="companyLogoUrl()!"
            alt="Company Logo"
            (load)="onLogoLoad()"
            (error)="onLogoError()"
          />
        } @else if (showUserAvatar()) {
          <img
            class="app-navbar__avatar"
            [src]="userAvatarUrl()!"
            [alt]="userDisplayName()"
            (error)="onUserAvatarError()"
          />
        } @else {
          <span class="app-navbar__avatar">{{ userInitial() }}</span>
        }

        <div class="app-navbar__profile-info">
          <span class="app-navbar__profile-name">{{ userDisplayName() }}</span>
          <small>{{ userRoleLabel() }}</small>
        </div>

        <i class="bi bi-chevron-down"></i>
      </button>

      @if (showProfile()) {
        <div class="app-navbar__dropdown-menu">
          <div class="app-navbar__dropdown-header">
            {{ currentUser()?.email }}
          </div>

          <a
            class="dropdown-item"
            [routerLink]="routes.profile"
            (click)="closeProfileMenu()"
          >
            <i class="bi bi-person"></i>
            <span>Profile</span>
          </a>

          <a
            class="dropdown-item"
            [routerLink]="settingsRoutes.settings.appearance"
            (click)="closeProfileMenu()"
          >
            <i class="bi bi-palette"></i>
            <span>Appearance</span>
          </a>

          <a
            class="dropdown-item"
            [routerLink]="settingsRoutes.settings.hub"
            (click)="closeProfileMenu()"
          >
            <i class="bi bi-gear"></i>
            <span>Settings</span>
          </a>

          <button type="button" class="dropdown-item text-danger" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i>
            <span>Sign Out</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>
