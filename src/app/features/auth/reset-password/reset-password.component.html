<div class="auth-form">
  <div class="auth-form__header">
    <h2 class="auth-form__title">Reset password</h2>
    <p class="auth-form__subtitle">Choose a new password for your BusinessOS account</p>
  </div>

  @if (tokenMissing) {
    <app-alert
      title="This reset link is incomplete"
      message="The reset link is missing or no longer valid. Request a new one to choose a password."
      variant="warning"
    />
    <p class="auth-form__footer">
      <a routerLink="/auth/forgot-password" class="auth-form__link">Request a new link</a>
    </p>
  } @else if (submitted()) {
    <app-alert
      title="Password updated"
      message="Your password has been reset. Sign in with your new password. Previous sessions have been signed out."
      variant="success"
    />
    <p class="auth-form__footer">
      <a routerLink="/auth/login" class="auth-form__link">Go to sign in →</a>
    </p>
  } @else {
    @if (errorMessage()) {
      <app-alert [message]="errorMessage()!" variant="danger" />
      <p class="auth-form__note">
        If the link expired, <a routerLink="/auth/forgot-password">request a new reset email</a>.
      </p>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <app-input label="Email" type="email" formControlName="email" [required]="true" [error]="getFieldError(form.controls.email, 'Email') ?? undefined" />
      <app-input
        label="New password"
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
        [required]="true"
        hint="At least 8 characters with uppercase, lowercase, and a number."
        [error]="getFieldError(form.controls.newPassword, 'Password') ?? undefined"
      />
      <app-input
        label="Confirm password"
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
        [required]="true"
        [error]="getFieldError(form.controls.confirmPassword, 'Confirm password') ?? undefined"
      />
      <app-button label="Reset password" type="submit" [loading]="loading()" [disabled]="loading()" [fullWidth]="true" />
    </form>

    <p class="auth-form__footer">
      <a routerLink="/auth/login" class="auth-form__link">← Back to sign in</a>
    </p>
  }
</div>
