<div class="auth-card">
  <div class="auth-card__header">
    <div class="auth-card__icon">
      <i class="bi bi-shield-lock"></i>
    </div>
    <h1>Welcome back</h1>
    <p>Sign in to continue to BusinessOS</p>
  </div>

  @if (errorMessage()) {
    <app-alert
      [message]="errorMessage()!"
      variant="danger"
      [dismissible]="true"
      (dismissed)="errorMessage.set(null)"
    ></app-alert>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label" for="loginEmail">Email address</label>
      <input
        id="loginEmail"
        type="email"
        class="form-control auth-input"
        formControlName="email"
        placeholder="you@company.com"
        autocomplete="email"
      />
    </div>

    <div class="mb-3">
      <label class="form-label" for="loginPassword">Password</label>
      <div class="password-wrapper">
        <input
          id="loginPassword"
          [type]="showPassword() ? 'text' : 'password'"
          class="form-control auth-input"
          formControlName="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="password-toggle"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          <i
            class="bi"
            [class.bi-eye]="!showPassword()"
            [class.bi-eye-slash]="showPassword()"
          ></i>
        </button>
      </div>
    </div>

    <div class="auth-card__meta mb-4">
      <div class="form-check">
        <input
          type="checkbox"
          class="form-check-input"
          id="rememberMe"
          formControlName="rememberMe"
        />
        <label class="form-check-label" for="rememberMe">Remember me</label>
      </div>

      <a routerLink="/auth/forgot-password" class="forgot-link">Forgot password?</a>
    </div>

    <button type="submit" class="mkt-btn mkt-btn--primary w-100" [disabled]="loading()">
      @if (loading()) {
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        Signing in...
      } @else {
        Sign in
        <i class="bi bi-arrow-right"></i>
      }
    </button>

    @if (devCredentials) {
      <button
        type="button"
        class="mkt-btn mkt-btn--ghost w-100 mt-3"
        (click)="fillDemoCredentials()"
      >
        <i class="bi bi-person-badge"></i>
        Use demo account
      </button>
    }

    <div class="auth-card__divider"><span>or</span></div>

    <p class="auth-card__switch">
      Don&rsquo;t have an account?
      <a routerLink="/auth/register">Create account</a>
    </p>
  </form>
</div>
