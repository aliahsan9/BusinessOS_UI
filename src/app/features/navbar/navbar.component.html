<nav class="navbar navbar-expand-lg fixed-top bos-nav" [class.scrolled]="isScrolled()">
  <div class="container">
    <a routerLink="/" class="navbar-brand bos-brand" (click)="closeSidebar()">
      <span class="bos-brand__mark" aria-hidden="true">
        <i class="bi bi-grid-1x2-fill"></i>
      </span>
      <span class="bos-brand__text">BusinessOS</span>
    </a>

    <div class="desktop-nav d-none d-lg-flex">
      @for (item of navItems; track item.label) {
        <a
          [routerLink]="item.route"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.route === '/' }"
          class="bos-nav__link"
        >
          {{ item.label }}
        </a>
      }
    </div>

    <div class="desktop-actions d-none d-lg-flex">
      <a routerLink="/auth/login" class="bos-nav__login">Sign in</a>
      <a routerLink="/auth/register" class="mkt-btn mkt-btn--primary bos-nav__cta">
        Start free trial
      </a>
    </div>

    <button
      type="button"
      class="bos-nav__toggle d-lg-none"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="isSidebarOpen()"
      aria-label="Toggle navigation"
    >
      <i class="bi" [class.bi-list]="!isSidebarOpen()" [class.bi-x-lg]="isSidebarOpen()"></i>
    </button>
  </div>
</nav>

@if (isSidebarOpen()) {
  <div class="bos-nav__backdrop" (click)="closeSidebar()" aria-hidden="true"></div>
}

<div class="bos-nav__drawer" [class.is-open]="isSidebarOpen()" role="dialog" aria-label="Mobile navigation">
  <div class="bos-nav__drawer-head">
    <a routerLink="/" class="bos-brand" (click)="closeSidebar()">
      <span class="bos-brand__mark" aria-hidden="true">
        <i class="bi bi-grid-1x2-fill"></i>
      </span>
      <span class="bos-brand__text">BusinessOS</span>
    </a>
    <button type="button" class="bos-nav__toggle" (click)="closeSidebar()" aria-label="Close navigation">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <nav class="bos-nav__drawer-links">
    @for (item of navItems; track item.label) {
      <a
        [routerLink]="item.route"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: item.route === '/' }"
        class="bos-nav__drawer-link"
        (click)="closeSidebar()"
      >
        <i class="bi" [ngClass]="item.icon"></i>
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="bos-nav__drawer-actions">
    <a routerLink="/auth/login" class="mkt-btn mkt-btn--ghost w-100" (click)="closeSidebar()">Sign in</a>
    <a routerLink="/auth/register" class="mkt-btn mkt-btn--primary w-100" (click)="closeSidebar()">
      Start free trial
    </a>
  </div>
</div>
